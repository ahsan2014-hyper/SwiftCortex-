<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SwiftCortex AI Ultra</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

<!-- Sidebar -->
<aside class="sidebar">

<div class="logo">
⚡ SwiftCortex AI
</div>

<button class="new-chat" id="newChat">
＋ New Chat
</button>

<div class="history">
<h3>History</h3>

<div id="historyList">
</div>

</div>

<div class="side-bottom">

<button id="themeBtn">
🌙 Dark Mode
</button>

</div>

</aside>



<!-- Main Chat -->
<main class="chat-area">


<header class="topbar">
<h2>SwiftCortex AI Ultra</h2>
</header>



<div class="messages" id="messages">

<div class="ai-message">
👋 Hello! I am SwiftCortex AI. How can I help you?
</div>

</div>



<!-- Image Preview -->
<div id="imagePreview"></div>



<!-- Input Area -->
<div class="input-area">


<!-- Plus Menu -->

<div class="plus-container">

<button id="plusBtn">
➕
</button>


<div class="plus-menu" id="plusMenu">

<button id="cameraBtn">
📷 Camera
</button>

<button id="photoBtn">
🖼 Photos
</button>

<button id="fileBtn">
📄 Files
</button>

<button id="pluginBtn">
🧩 Plugins
</button>

<button id="thinkBtn">
🧠 Think Harder
</button>

</div>

</div>



<input 
type="file" 
id="imageInput" 
accept="image/*"
hidden
>


<input 
type="file" 
id="fileInput"
hidden
>



<textarea 
id="userInput"
placeholder="Message SwiftCortex AI..."
></textarea>



<button id="sendBtn">
➤
</button>


</div>


</main>


</div>



<script src="script.js"></script>

</body>
</html>
