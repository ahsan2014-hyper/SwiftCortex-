<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwiftCortex AI</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:white;
text-align:center;
}

header{
background:#111827;
padding:20px;
font-size:30px;
font-weight:bold;
color:#00e5ff;
}

.container{
padding:20px;
}

textarea{
width:90%;
height:120px;
border-radius:10px;
padding:10px;
font-size:16px;
}

button{
margin:10px;
padding:12px 20px;
font-size:18px;
border:none;
border-radius:10px;
background:#00e5ff;
color:black;
font-weight:bold;
}

#output{
margin-top:20px;
padding:15px;
background:#1e293b;
border-radius:10px;
}
</style>

</head>

<body>

<header>
⚡ SwiftCortex AI
</header>

<div class="container">

<h2>AI Assistant</h2>

<textarea id="prompt" placeholder="Ask anything..."></textarea>

<br>

<button onclick="chat()">Chat</button>

<button onclick="translateText()">Translate</button>

<button onclick="voice()">🎤 Voice</button>

<button onclick="calling()">📞 Calling</button>

<div id="output"></div>

</div>


<script>
const API_KEY = AQ.Ab8RN6KQFZK9KWVUpxpn98LVXILnqxgW5W8W3RYSKPEZLf3mIQ

async function chat() {
  const text = document.getElementById("prompt").value;
  const output = document.getElementById("output");

  if (!text.trim()) {
    output.innerHTML = "Please enter a message.";
    return;
  }

  output.innerHTML = "Thinking...";

  try {
    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + API_KEY,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          contents: [
            {
              parts: [
                {
                  text: text
                }
              ]
            }
          ]
        })
      }
    );

    const data = await response.json();

    const reply =
      data.candidates?.[0]?.content?.parts?.[0]?.text ||
      "No response received.";

    output.innerHTML = "<h3>SwiftCortex AI</h3><p>" + reply + "</p>";

  } catch (err) {
    output.innerHTML = "Error: " + err.message;
  }
}

function translateText() {
  alert("Live Translate Coming Soon");
}

function voice() {
  alert("Voice Assistant Ready");
}

function calling() {
  alert("AI Calling Ready");
}
</script>
</body>
</html>
